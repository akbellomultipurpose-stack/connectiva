<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>CONNECTIVA</title>
  <meta name="description" content="CONNECTIVA — connect, discover, create.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#09090b;--panel:#111114;--panel2:#17171b;--text:#f6f6f7;--muted:#9b9ba3;
      --border:#28282e;--accent:#8b5cf6;--accent2:#6d28d9;--danger:#ef4444;--ok:#22c55e;
      --shadow:0 18px 50px rgba(0,0,0,.28);--radius:18px
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}
    a{color:inherit;text-decoration:none}.hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,720px) 300px;gap:18px;max-width:1440px;margin:auto;padding:18px}
    .sidebar,.rightbar{position:sticky;top:18px;height:calc(100vh - 36px)}
    .sidebar{display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:10px 12px 22px;font-weight:900;font-size:22px;letter-spacing:.5px}
    .brandmark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#ec4899);display:grid;place-items:center;font-weight:1000}
    .nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:13px 14px;border-radius:13px;font-weight:700}
    .nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}
    .account-mini{margin-top:auto;border:1px solid var(--border);background:var(--panel);border-radius:16px;padding:12px}
    .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#24242a;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto}
    .avatar img{width:100%;height:100%;object-fit:cover}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
    .main{min-width:0}.topbar{position:sticky;top:0;z-index:5;background:rgba(9,9,11,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 2px}
    .topbar h1{margin:0;font-size:20px}.search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:11px 13px;color:var(--text);outline:none}
    .search:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.14)}
    .tabs{display:flex;gap:6px;margin-top:10px;overflow:auto}.tabs button{white-space:nowrap;border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px}.tabs button.active{color:var(--text);border-color:var(--accent);background:rgba(139,92,246,.12)}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.12)}
    .composer{padding:14px}.composer textarea{width:100%;min-height:85px;resize:vertical;background:var(--panel2);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:12px;outline:none}
    .btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:11px;font-weight:750}.btn:hover{border-color:#44444d}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#ff8b8b}
    .post{overflow:hidden}.post-head{padding:13px;display:flex;gap:10px;align-items:center}.post-body{padding:0 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}.post-media{width:100%;max-height:620px;object-fit:cover;background:#050507}.post-actions{display:flex;gap:5px;border-top:1px solid var(--border);padding:8px 10px}.post-actions button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px}.post-actions button:hover{background:var(--panel2);color:var(--text)}
    .story-strip{display:flex;gap:12px;overflow:auto;padding:13px}.story{min-width:66px;text-align:center;font-size:12px;color:var(--muted)}.story .avatar{margin:auto;border:2px solid var(--accent)}
    .rightbar{display:grid;align-content:start;gap:14px}.side-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}.side-card h3{margin:0 0 12px;font-size:15px}
    .muted{color:var(--muted)}.small{font-size:12px}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(139,92,246,.15);color:#c4b5fd}.premium{color:#f5d77a;background:rgba(245,215,122,.1)}
    .screen{padding-bottom:80px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.loader{text-align:center;padding:25px;color:var(--muted)}
    .profile-cover{height:190px;border-radius:18px 18px 0 0;background:linear-gradient(135deg,#211044,#16161b);position:relative}.profile-avatar{position:absolute;bottom:-44px;left:20px;width:92px;height:92px;border:5px solid var(--panel)}
    .profile-info{padding:55px 20px 20px}.profile-actions{display:flex;gap:8px;flex-wrap:wrap}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center}.stat strong{display:block;font-size:18px}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#211044 0,#09090b 50%)}.auth{width:min(430px,100%);background:rgba(17,17,20,.96);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
    .auth h1{font-size:30px;margin:0 0 8px}.auth input{width:100%;margin:7px 0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:13px;outline:none}
    .toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#18181c;border:1px solid var(--border);padding:12px 15px;border-radius:13px;box-shadow:var(--shadow);max-width:360px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:18px;z-index:50}.modal-box{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px}
    .list{display:grid;gap:8px}.list-item{padding:11px;border:1px solid var(--border);border-radius:13px;background:var(--panel2)}
    @media(max-width:1100px){.app{grid-template-columns:220px minmax(0,720px)}.rightbar{display:none}}
    @media(max-width:760px){.app{display:block;padding:0}.sidebar{position:fixed;z-index:20;bottom:0;left:0;right:0;top:auto;height:auto;background:rgba(9,9,11,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:5px}.brand,.account-mini{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:11px;text-align:center;padding:9px 8px}.main{padding-bottom:60px}.topbar{padding:10px 12px}.card{border-radius:14px;margin:10px 8px}.story-strip{padding:10px 8px}}
  </style>
</head>
<body>
<div id="authView" class="auth-wrap">
  <div class="auth">
    <div class="brand"><div class="brandmark">C</div> CONNECTIVA</div>
    <h1>Welcome back.</h1>
    <p class="muted">Sign in with a one-time email code.</p>
    <form id="otpForm">
      <input id="email" type="email" autocomplete="email" placeholder="Email address" required>
      <button class="btn primary" style="width:100%;margin-top:8px">Send OTP</button>
    </form>
    <form id="verifyForm" class="hidden">
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter OTP" required>
      <button class="btn primary" style="width:100%;margin-top:8px">Verify & continue</button>
      <button type="button" id="backOtp" class="btn" style="width:100%;margin-top:8px">Use another email</button>
    </form>
    <p id="authMsg" class="small muted"></p>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">C</div> CONNECTIVA</div>
    <nav id="nav" class="nav">
      <button data-screen="home">🏠 Home</button>
      <button data-screen="discover">🔎 Discover</button>
      <button data-screen="create">➕ Create</button>
      <button data-screen="messages">💬 Messages</button>
      <button data-screen="profile">👤 Profile</button>
      <button data-screen="notifications">🔔 Alerts</button>
      <button data-screen="settings">⚙️ Settings</button>
    </nav>
    <div class="account-mini">
      <div class="row">
        <div id="miniAvatar" class="avatar">C</div>
        <div style="min-width:0"><strong id="miniName">CONNECTIVA</strong><div id="miniUser" class="small muted">@user</div></div>
      </div>
      <button id="logout" class="btn danger" style="width:100%;margin-top:10px">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="row between"><h1 id="screenTitle">Home</h1><button id="refresh" class="btn">↻</button></div>
      <div style="margin-top:10px"><input id="globalSearch" class="search" placeholder="Search people, posts, topics..."></div>
      <div id="tabs" class="tabs"></div>
    </div>
    <section id="screen" class="screen"></section>
  </main>

  <aside class="rightbar">
    <div class="side-card">
      <h3>Your account</h3>
      <div id="sideAccount"></div>
    </div>
    <div class="side-card">
      <h3>CONNECTIVA</h3>
      <p class="small muted">A production-oriented social platform powered by your Supabase backend.</p>
      <p class="small muted">Premium access is read from server-side entitlements.</p>
    </div>
  </aside>
</div>

<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://mrzlxirhwwtqzigjqqkd.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zcl7cHBt-q-cSITBSik4Bg_cHWnK7Cq";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = id => document.getElementById(id);
  const state = {
    user:null, profile:null, entitlement:null, screen:"home", feed:[],
    searchTimer:null, otpEmail:"", loading:false
  };

  function toast(message, ms=3500){
    const el=$("toast"); el.textContent=message; el.classList.remove("hidden");
    clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add("hidden"),ms);
  }
  function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function initials(name="C"){return esc((name.trim()[0]||"C").toUpperCase());}
  function avatarHTML(p,size="42"){
    const name=p?.display_name||p?.username||"CONNECTIVA";
    return `<div class="avatar" style="width:${size}px;height:${size}px">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:initials(name)}</div>`;
  }
  function timeAgo(date){
    if(!date)return "";
    const s=Math.max(1,Math.floor((Date.now()-new Date(date).getTime())/1000));
    if(s<60)return s+"s"; if(s<3600)return Math.floor(s/60)+"m";
    if(s<86400)return Math.floor(s/3600)+"h"; if(s<604800)return Math.floor(s/86400)+"d";
    return new Date(date).toLocaleDateString();
  }
  function showModal(html){$("modalBox").innerHTML=html;$("modal").classList.remove("hidden");}
  function closeModal(){$("modal").classList.add("hidden");}
  $("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});

  async function query(table, opts={}){
    let q=sb.from(table).select(opts.select||"*");
    if(opts.eq)for(const [k,v] of Object.entries(opts.eq))q=q.eq(k,v);
    if(opts.neq)for(const [k,v] of Object.entries(opts.neq))q=q.neq(k,v);
    if(opts.order)q=q.order(opts.order,{ascending:opts.ascending??false});
    if(opts.limit)q=q.limit(opts.limit);
    if(opts.single)q=q.maybeSingle();
    return q;
  }

  async function loadProfile(){
    if(!state.user)return;
    const {data,error}=await query("profiles",{eq:{id:state.user.id},single:true});
    if(error) console.warn("Profile load:",error.message);
    state.profile=data||{id:state.user.id,display_name:state.user.email?.split("@")[0]||"User",username:null};
    renderAccount();
  }

  async function loadEntitlement(){
    try{
      const {data,error}=await sb.rpc("get_my_entitlement");
      if(!error && data) state.entitlement=Array.isArray(data)?data[0]:data;
    }catch(e){console.warn(e)}
  }

  function renderAccount(){
    const p=state.profile||{};
    $("miniAvatar").innerHTML=p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:initials(p.display_name||p.username);
    $("miniName").textContent=p.display_name||p.username||"User";
    $("miniUser").textContent=p.username?"@"+p.username:(state.user?.email||"");
    $("sideAccount").innerHTML=`<div class="row">${avatarHTML(p)}<div><strong>${esc(p.display_name||"User")}</strong><div class="small muted">${esc(p.username?"@"+p.username:(state.user?.email||""))}</div></div></div>
      ${state.entitlement?.plan_tier&&state.entitlement.plan_tier!=="standard"?`<div class="status premium" style="margin-top:10px;display:inline-block">✦ ${esc(state.entitlement.plan_tier)}</div>`:""}`;
  }

  async function loadFeed(){
    $("screen").innerHTML='<div class="loader">Loading your feed…</div>';
    let data=null,error=null;
    try{
      const r=await sb.rpc("get_home_feed",{p_limit:30,p_before:null}); data=r.data; error=r.error;
    }catch(e){error=e}
    if(error){
      // Fallback to a direct public posts query if the feed RPC is unavailable.
      const r=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(30);
      data=r.data; error=r.error;
    }
    if(error){$("screen").innerHTML=`<div class="empty">Could not load the feed.<br><span class="small">${esc(error.message||"Database error")}</span></div>`;return}
    state.feed=data||[]; renderHome();
  }

  function postHTML(post){
    const author=post.profiles||post.author||post.user||{};
    const name=author.display_name||post.author_name||post.display_name||"CONNECTIVA user";
    const username=author.username||post.username||"";
    const text=post.content??post.body??post.caption??"";
    const media=post.media_url||post.image_url||post.video_url||null;
    return `<article class="card post" data-post="${esc(post.id||"")}">
      <div class="post-head">${avatarHTML(author)}<div style="min-width:0;flex:1"><strong>${esc(name)}</strong><div class="small muted">${username?"@"+esc(username)+" · ":""}${timeAgo(post.created_at)}</div></div><button class="btn small post-menu">•••</button></div>
      ${text?`<div class="post-body">${esc(text)}</div>`:""}
      ${media?`<img class="post-media" src="${esc(media)}" alt="Post media" loading="lazy">`:""}
      <div class="post-actions">
        <button class="like-btn">♡ Like</button><button class="comment-btn">💬 Comment</button><button class="share-btn">↗ Share</button><button class="save-btn">🔖 Save</button>
      </div>
    </article>`;
  }

  function renderHome(){
    $("screen").innerHTML=`
      <div class="card story-strip">
        <div class="story"><div class="avatar">＋</div><div>Create</div></div>
        <div class="story">${avatarHTML(state.profile,48)}<div>Your story</div></div>
        <div class="story">${avatarHTML({display_name:"Discover"},48)}<div>Discover</div></div>
      </div>
      <div class="card composer">
        <div class="row">${avatarHTML(state.profile)}<button id="quickCreate" class="btn" style="flex:1;text-align:left">What’s happening?</button></div>
      </div>
      <div id="feed">${state.feed.length?state.feed.map(postHTML).join(""):'<div class="empty">Your feed is empty. Create the first post.</div>'}</div>`;
    $("quickCreate").onclick=()=>navigate("create");
    $("feed").addEventListener("click",handlePostAction);
  }

  async function handlePostAction(e){
    const card=e.target.closest("[data-post]"); if(!card)return;
    const id=card.dataset.post;
    if(e.target.closest(".like-btn")){
      // Prefer an existing post_likes table. The UI reflects server success only.
      const r=await sb.from("post_likes").insert({post_id:id,user_id:state.user.id});
      if(r.error && !/duplicate|unique/i.test(r.error.message)) toast(r.error.message);
      else toast(r.error?"Already liked":"Liked");
    } else if(e.target.closest(".comment-btn")){
      showModal(`<h2>Comment</h2><textarea id="commentText" class="search" style="min-height:120px" placeholder="Write a comment…"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button id="closeM" class="btn">Cancel</button><button id="sendComment" class="btn primary">Comment</button></div>`);
      $("closeM").onclick=closeModal;
      $("sendComment").onclick=async()=>{
        const content=$("commentText").value.trim(); if(!content)return;
        const r=await sb.from("comments").insert({post_id:id,author_id:state.user.id,content});
        if(r.error)toast(r.error.message);else{closeModal();toast("Comment posted");}
      };
    } else if(e.target.closest(".share-btn")){
      try{await navigator.clipboard?.writeText(location.href+"#post-"+id)}catch{}
      toast("Share link prepared");
    } else if(e.target.closest(".save-btn")){
      const r=await sb.from("saved_posts").insert({post_id:id,user_id:state.user.id});
      if(r.error && !/duplicate|unique/i.test(r.error.message))toast(r.error.message);else toast(r.error?"Already saved":"Saved");
    }
  }

  function renderDiscover(){
    $("screen").innerHTML=`<div class="card" style="padding:14px"><h2 style="margin-top:0">Discover</h2><p class="muted">Search CONNECTIVA content and people.</p><div id="searchResults" class="list"><div class="empty">Type in the search box above.</div></div></div>`;
    $("globalSearch").focus();
  }

  async function runSearch(term){
    const out=$("searchResults"); if(!out)return;
    term=term.trim(); if(!term){out.innerHTML='<div class="empty">Type in the search box above.</div>';return}
    out.innerHTML='<div class="loader">Searching…</div>';
    const [people,posts]=await Promise.all([
      sb.from("profiles").select("id,username,display_name,avatar_url").or(`username.ilike.%${term}%,display_name.ilike.%${term}%`).limit(10),
      sb.from("posts").select("*").ilike("content",`%${term}%`).order("created_at",{ascending:false}).limit(10)
    ]);
    let html="";
    if(people.data?.length)html+=`<h3>People</h3>`+people.data.map(p=>`<div class="list-item row">${avatarHTML(p)}<div><strong>${esc(p.display_name||p.username||"User")}</strong><div class="small muted">@${esc(p.username||"")}</div></div></div>`).join("");
    if(posts.data?.length)html+=`<h3>Posts</h3>`+posts.data.map(postHTML).join("");
    out.innerHTML=html||'<div class="empty">No results found.</div>';
  }

  function renderCreate(){
    $("screen").innerHTML=`<div class="card composer"><h2 style="margin-top:0">Create</h2><p class="muted">Publish a real CONNECTIVA post.</p>
      <textarea id="postText" placeholder="What’s happening?"></textarea>
      <div class="row between" style="margin-top:10px"><span class="small muted">Text posts are available now. Media upload can be connected to Supabase Storage.</span><button id="publish" class="btn primary">Publish</button></div>
    </div>
    <div class="card" style="padding:15px"><h3>More creation tools</h3><div class="grid2">
      <button class="btn" onclick="toast('Story creation UI is ready for Storage integration.')">📖 Story</button>
      <button class="btn" onclick="toast('Short creation requires media processing infrastructure.')">🎬 Short</button>
      <button class="btn" onclick="toast('Live requires the server-side eligibility rule plus streaming infrastructure.')">🔴 Live</button>
      <button class="btn" onclick="toast('Community creation can use the existing communities schema.')">👥 Community</button>
    </div></div>`;
    $("publish").onclick=publishPost;
  }

  async function publishPost(){
    const content=$("postText").value.trim(); if(!content)return toast("Write something first.");
    const r=await sb.from("posts").insert({author_id:state.user.id,content});
    if(r.error){toast(r.error.message);return}
    toast("Post published."); $("postText").value=""; navigate("home");
  }

  async function renderMessages(){
    $("screen").innerHTML='<div class="card" style="padding:18px"><h2 style="margin-top:0">Messages</h2><div class="loader">Loading conversations…</div></div>';
    const r=await sb.from("conversation_members").select("*").eq("user_id",state.user.id).limit(50);
    if(r.error){$("screen").innerHTML=`<div class="card"><div class="empty">${esc(r.error.message)}</div></div>`;return}
    $("screen").innerHTML=`<div class="card" style="padding:15px"><h2 style="margin-top:0">Messages</h2><p class="muted">Your conversation membership is connected to Supabase.</p><div class="list">${(r.data||[]).map(x=>`<div class="list-item"><strong>Conversation</strong><div class="small muted">${esc(x.conversation_id||"")}</div></div>`).join("")||'<div class="empty">No conversations yet.</div>'}</div></div>`;
  }

  async function renderProfile(){
    const p=state.profile||{};
    let counts={followers:0,following:0,posts:0};
    try{
      const [f1,f2,ps]=await Promise.all([
        sb.from("follows").select("*",{count:"exact",head:true}).eq("following_id",state.user.id),
        sb.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",state.user.id),
        sb.from("posts").select("*",{count:"exact",head:true}).eq("author_id",state.user.id)
      ]);
      counts={followers:f1.count||0,following:f2.count||0,posts:ps.count||0};
    }catch{}
    $("screen").innerHTML=`<div class="card" style="overflow:hidden"><div class="profile-cover"></div><div class="profile-info">
      <div class="profile-avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="" style="width:100%;height:100%;object-fit:cover">`:initials(p.display_name||p.username)}</div>
      <div class="row between"><div><h2 style="margin:0">${esc(p.display_name||"User")}</h2><div class="muted">@${esc(p.username||"")}</div></div>${state.entitlement?.plan_tier!=="standard"?'<span class="status premium">✦ Premium</span>':""}</div>
      <p>${esc(p.bio||"")}</p><div class="grid2"><div class="stat"><strong>${counts.posts}</strong><span class="small muted">Posts</span></div><div class="stat"><strong>${counts.followers}</strong><span class="small muted">Followers</span></div><div class="stat"><strong>${counts.following}</strong><span class="small muted">Following</span></div><div class="stat"><strong>${esc(state.entitlement?.plan_tier||"standard")}</strong><span class="small muted">Plan</span></div></div>
      <div class="profile-actions" style="margin-top:12px"><button id="editProfile" class="btn primary">Edit profile</button><button class="btn" onclick="navigator.clipboard?.writeText(location.href);toast('Profile link copied')">Share profile</button></div>
    </div></div>`;
    $("editProfile").onclick=editProfile;
  }

  function editProfile(){
    const p=state.profile||{};
    showModal(`<h2>Edit profile</h2><label class="small muted">Display name</label><input id="epName" class="search" value="${esc(p.display_name||"")}"><label class="small muted">Username</label><input id="epUser" class="search" value="${esc(p.username||"")}"><label class="small muted">Bio</label><textarea id="epBio" class="search" style="min-height:110px">${esc(p.bio||"")}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="cancelEdit" class="btn">Cancel</button><button id="saveEdit" class="btn primary">Save</button></div>`);
    $("cancelEdit").onclick=closeModal;$("saveEdit").onclick=saveProfile;
  }
  async function saveProfile(){
    const payload={display_name:$("epName").value.trim(),username:$("epUser").value.trim()||null,bio:$("epBio").value.trim()};
    const r=await sb.from("profiles").update(payload).eq("id",state.user.id);
    if(r.error){toast(r.error.message);return} closeModal();await loadProfile();renderProfile();toast("Profile updated");
  }

  async function renderNotifications(){
    const r=await sb.from("notifications").select("*").eq("user_id",state.user.id).order("created_at",{ascending:false}).limit(50);
    if(r.error){$("screen").innerHTML=`<div class="card"><div class="empty">${esc(r.error.message)}</div></div>`;return}
    $("screen").innerHTML=`<div class="card" style="padding:15px"><h2 style="margin-top:0">Notifications</h2><div class="list">${(r.data||[]).map(n=>`<div class="list-item"><strong>${esc(n.title||n.type||"Notification")}</strong><div>${esc(n.message||n.body||"")}</div><div class="small muted">${timeAgo(n.created_at)}</div></div>`).join("")||'<div class="empty">No notifications.</div>'}</div></div>`;
  }

  function renderSettings(){
    $("screen").innerHTML=`<div class="card" style="padding:15px"><h2 style="margin-top:0">Settings</h2>
      <div class="list">
        <button class="list-item" style="color:var(--text);text-align:left" onclick="navigate('profile')">👤 Account & Profile</button>
        <button class="list-item" style="color:var(--text);text-align:left" onclick="toast('Security controls are enforced by Supabase Auth and database policies.')">🔐 Security</button>
        <button class="list-item" style="color:var(--text);text-align:left" onclick="toast('Notification preferences can be connected to notification_preferences.')">🔔 Notifications</button>
        <button class="list-item" style="color:var(--text);text-align:left" onclick="toggleTheme()">🎨 Appearance</button>
        <button class="list-item" style="color:var(--text);text-align:left" onclick="toast('Privacy controls are enforced server-side by RLS and application policies.')">🛡️ Privacy & Safety</button>
        <button class="list-item" style="color:var(--text);text-align:left" onclick="downloadAccountData()">📦 Request account data</button>
      </div></div>`;
  }

  async function downloadAccountData(){
    const data={profile:state.profile,entitlement:state.entitlement,exported_at:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="connectiva-account.json";a.click();URL.revokeObjectURL(a.href);
    toast("Account data export prepared");
  }
  function toggleTheme(){
    const light=document.documentElement.dataset.theme==="light";
    if(light){delete document.documentElement.dataset.theme;toast("Dark mode enabled")}
    else{document.documentElement.dataset.theme="light";toast("Light mode enabled")}
  }

  async function navigate(screen){
    state.screen=screen;
    document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===screen));
    $("screenTitle").textContent=screen[0].toUpperCase()+screen.slice(1);
    $("globalSearch").value="";
    if(screen==="home")await loadFeed();
    else if(screen==="discover")renderDiscover();
    else if(screen==="create")renderCreate();
    else if(screen==="messages")await renderMessages();
    else if(screen==="profile")await renderProfile();
    else if(screen==="notifications")await renderNotifications();
    else if(screen==="settings")renderSettings();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  window.navigate=navigate;
  window.toast=toast;
  window.toggleTheme=toggleTheme;

  async function boot(user){
    state.user=user;
    $("authView").classList.add("hidden");$("appView").classList.remove("hidden");
    await loadProfile();await loadEntitlement();renderAccount();await navigate("home");
  }

  $("otpForm").addEventListener("submit",async e=>{
    e.preventDefault();const email=$("email").value.trim();if(!email)return;
    $("authMsg").textContent="Sending OTP…";
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
    if(error){$("authMsg").textContent=error.message;return}
    state.otpEmail=email;$("otpForm").classList.add("hidden");$("verifyForm").classList.remove("hidden");$("authMsg").textContent="OTP sent. Check your email.";
  });
  $("verifyForm").addEventListener("submit",async e=>{
    e.preventDefault();const token=$("otp").value.trim();if(!token)return;
    $("authMsg").textContent="Verifying…";
    const {data,error}=await sb.auth.verifyOtp({email:state.otpEmail,token,type:"email"});
    if(error){$("authMsg").textContent=error.message;return}
    if(data.user)await boot(data.user);
  });
  $("backOtp").onclick=()=>{$("verifyForm").classList.add("hidden");$("otpForm").classList.remove("hidden");$("authMsg").textContent=""};
  $("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("refresh").onclick=()=>navigate(state.screen);

  $("nav").addEventListener("click",e=>{const b=e.target.closest("[data-screen]");if(b)navigate(b.dataset.screen)});
  $("globalSearch").addEventListener("input",e=>{
    clearTimeout(state.searchTimer);const v=e.target.value;
    if(state.screen!=="discover")return;
    state.searchTimer=setTimeout(()=>runSearch(v),350);
  });

  sb.auth.onAuthStateChange(async (_event,session)=>{
    if(session?.user && !state.user)await boot(session.user);
    if(!session?.user){state.user=null;$("authView").classList.remove("hidden");$("appView").classList.add("hidden")}
  });

  (async()=>{
    const {data}=await sb.auth.getSession();
    if(data.session)await boot(data.session.user);
  })();
})();
</script>
</body>
</html>
